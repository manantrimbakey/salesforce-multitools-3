# Dependabot security updates always open PRs against the default branch (master); `target-branch` in dependabot.yml is
# ignored for them. Our flow is dev2 -> dev1 -> master, so move those PRs to dev2.
#
# `pull_request_target` runs the workflow file from the base branch with a write token (a plain `pull_request` run for
# Dependabot gets a read-only token). That is safe here because nothing from the PR is checked out or executed: the job
# only calls `gh pr edit` with the PR number. This file must exist on master to take effect.
name: Retarget Dependabot PRs

on:
    pull_request_target:
        types: [opened, reopened]
        branches: [master]
    workflow_dispatch: # backfill: retarget every open Dependabot PR still pointing at master

permissions:
    contents: read
    pull-requests: write

env:
    TARGET_BRANCH: dev2

jobs:
    retarget:
        name: Retarget to dev2
        if: github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]'
        runs-on: ubuntu-latest
        steps:
            - name: Change base branch
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  gh pr edit "$PR_NUMBER" --base "$TARGET_BRANCH"
                  echo "Retargeted #$PR_NUMBER to $TARGET_BRANCH" >> "$GITHUB_STEP_SUMMARY"

    backfill:
        name: Retarget open Dependabot PRs
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            # Default branch only (trusted); runs the repo's own script.
            - uses: actions/checkout@v4
            - name: Retarget
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
              run: bash scripts/dev/retarget-dependabot-prs.sh --apply --base "$TARGET_BRANCH"
